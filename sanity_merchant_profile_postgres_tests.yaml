- name: merchant-profile-sanity
  repetitions: 1
  duration: 15s
  driver: hazelcast-enterprise5
  version: maven=5.7.0
  loadgenerator_count: 2
  node_count: 0
  loadgenerator_hosts: loadgenerators
  node_hosts: nodes
  client_args: >
    -Xms2g
    -Xmx2g
  performance_monitor_interval_seconds: 1
  verify_enabled: true
  warmup_seconds: 5
  cooldown_seconds: 0
  test:
    - class: com.hazelcast.simudedupe.tests.MerchantProfileTest
      name: merchantProfile
      mapName: merchant-profile
      threadCount: 4
      keyDomain: 1_000_000
      startId: 0
      merchantIdPrefix: "300000000000000000"
      valueCacheSize: 16
      expectedSerializedValueSizeBytes: 10_240
      updateRunId: 102
      databaseConnectionName: dedup-postgres
      databaseTableName: merchant_profile
      databaseVerificationTimeoutSeconds: 600
      ratePerSecond: 100
