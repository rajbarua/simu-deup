- name: imap-postgres-sanity
  repetitions: 1
  duration: 15s
  driver: hazelcast-enterprise5
  version: maven=5.7.0
  clients: 2
  members: 0
  loadgenerator_hosts: loadgenerators
  node_hosts: nodes
  client_args: >
    -Xms2g
    -Xmx2g
  performance_monitor_interval_seconds: 1
  verify_enabled: true
  warmup_seconds: 2
  cooldown_seconds: 2
  test:
    - class: com.hazelcast.simudedupe.tests.DedupPutIfAbsentTest
      name: deduplicate
      threadCount: 4
      existingKeyDomain: 1_000_000
      existingKeySampleSize: 1_000
      existingKeyPercentage: 50
      existingIdPrefix: "100000000000000000"
      newIdPrefix: "2"
      newKeyRunId: 101
      ratePerSecond: 200
