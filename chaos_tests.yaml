- name: podfailure
  repetitions: 1
  duration: 120s
  driver: hazelcast5
  version: maven=5.7.0
  clients: 2
  members: 0
  loadgenerator_hosts: loadgenerators
  node_hosts: nodes
  client_args: >
    -Xms6g
    -Xmx6g
    --add-modules java.se 
    --add-exports java.base/jdk.internal.ref=ALL-UNNAMED 
    --add-opens java.base/java.lang=ALL-UNNAMED 
    --add-opens java.base/sun.nio.ch=ALL-UNNAMED 
    --add-opens java.management/sun.management=ALL-UNNAMED 
    --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED
  performance_monitor_interval_seconds: 1
  verify_enabled: True
  warmup_seconds: 10
  cooldown_seconds: 10
  test:
    - class: com.hazelcast.simulator.tests.map.LongByteArrayMapTest
      name: paymentsDedup
      # increased parallel load on client side
      threadCount: 40
      getProb: 0.8
      setProb: 0.0
      putProb: 0.2
      keyDomain: 5_000_000
      valueCount: 10000
      minValueLength: 1_000
      maxValueLength: 1_000
      ratePerSecond: 10_000
