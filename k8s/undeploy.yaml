- name: Tear down Hazelcast cluster and application
  hosts: localhost
  gather_facts: false
  vars_files:
    - roles/gke/vars/main.yml
    - roles/hz/vars/main.yml
  vars:
    hazelcast_namespace: default
    chaos_namespace: chaos-mesh
    clc_configs:
      - hz-primary
      - simu-dedup-local
    hazelcast_secret_names:
      - hazelcast-agent-cert
      - hazelcast-license
      - hazelcast-mc
      - hazelcast-ssl
      - hz-primary
      - mapstore-deduplicate
      - primary-custom-config
    hazelcast_configmap_names:
      - hazelcast-keystore
      - hz-primary-init
      - primary-custom-config-cm
      - simu-dedup-user-code
    postgres_resource_names:
      - { resource: "job", name: "postgres-dedup-seed" }
      - { resource: "job", name: "postgres-dedup-schema" }
      - { resource: "statefulset", name: "postgres" }
      - { resource: "service", name: "postgres" }
      - { resource: "configmap", name: "postgres-dedup-seed" }
      - { resource: "configmap", name: "postgres-init-scripts" }
      - { resource: "secret", name: "postgres-auth" }
    default_pvc_pattern: "(data-postgres|mancenter-storage-hazelcast-mc|hz-primary|hazelcast-mc)"

  tasks:
    - name: Authorize access to Google Cloud with a service account
      ansible.builtin.shell: |
        set -o pipefail
        gcloud auth activate-service-account --key-file={{ credentials_file }}
      args:
        executable: /bin/bash
      changed_when: false
      tags:
        - undeploy
        - gke

    - name: Check whether GKE cluster exists
      ansible.builtin.shell: |
        set -o pipefail
        gcloud container clusters describe {{ cluster_name }} \
          --zone {{ zone }} \
          --project {{ project_id }} \
          --format='value(name)'
      args:
        executable: /bin/bash
      register: gke_cluster_describe
      changed_when: false
      failed_when: false
      tags:
        - undeploy
        - gke
        - k8s

    - name: Track GKE cluster existence
      ansible.builtin.set_fact:
        gke_cluster_exists: "{{ gke_cluster_describe.rc == 0 }}"
      tags:
        - undeploy
        - gke
        - k8s

    - name: Get the GKE cluster credentials
      ansible.builtin.shell: |
        set -o pipefail
        gcloud container clusters get-credentials {{ cluster_name }} \
          --zone {{ zone }} \
          --project {{ project_id }}
      args:
        executable: /bin/bash
      changed_when: false
      when: gke_cluster_exists
      tags:
        - undeploy
        - gke
        - k8s

    - name: Remove local CLC configs if present
      ansible.builtin.shell: |
        set -o pipefail
        if command -v clc >/dev/null 2>&1; then
          clc config delete {{ item }}
        fi
      args:
        executable: /bin/bash
      loop: "{{ clc_configs }}"
      register: clc_remove
      changed_when: clc_remove.rc == 0 and (clc_remove.stdout | default('') | length > 0)
      failed_when: clc_remove.rc not in [0, 1]
      tags:
        - undeploy
        - clc
        - hz

    - name: Delete Chaos Mesh experiment custom resources
      ansible.builtin.shell: |
        set -o pipefail
        for kind in podchaos networkchaos stresschaos iochaos timechaos kernelchaos dnschaos httpchaos schedule workflow; do
          kubectl delete "$kind" --all -A --ignore-not-found=true 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      register: chaos_experiments_delete
      changed_when: "'deleted' in (chaos_experiments_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - chaos
        - k8s

    - name: Delete Hazelcast JetJob custom resources
      ansible.builtin.shell: |
        set -o pipefail
        kubectl delete jetjob.hazelcast.com --all \
          -n {{ hazelcast_namespace }} \
          --ignore-not-found=true \
          --wait=true \
          --timeout=300s 2>/dev/null || true
      args:
        executable: /bin/bash
      register: hz_jet_jobs_delete
      changed_when: "'deleted' in (hz_jet_jobs_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - jet
        - k8s

    - name: Delete Hazelcast map custom resources
      ansible.builtin.shell: |
        set -o pipefail
        kubectl delete map.hazelcast.com --all \
          -n {{ hazelcast_namespace }} \
          --ignore-not-found=true 2>/dev/null || true
      args:
        executable: /bin/bash
      register: hz_maps_delete
      changed_when: "'deleted' in (hz_maps_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - maps
        - k8s

    - name: Delete Hazelcast Management Center custom resource
      ansible.builtin.shell: |
        set -o pipefail
        kubectl delete managementcenter.hazelcast.com hazelcast-mc \
          -n {{ hazelcast_namespace }} \
          --ignore-not-found=true \
          --wait=true \
          --timeout=300s 2>/dev/null || true
      args:
        executable: /bin/bash
      register: hz_mc_delete
      changed_when: "'deleted' in (hz_mc_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - mc
        - k8s

    - name: Delete Hazelcast cluster custom resource
      ansible.builtin.shell: |
        set -o pipefail
        kubectl delete hazelcast.hazelcast.com hz-primary \
          -n {{ hazelcast_namespace }} \
          --ignore-not-found=true \
          --wait=true \
          --timeout=600s 2>/dev/null || true
      args:
        executable: /bin/bash
      register: hz_cluster_delete
      changed_when: "'deleted' in (hz_cluster_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - k8s

    - name: Delete Postgres resources
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - "{{ item.resource }}"
          - "{{ item.name }}"
          - --namespace={{ hazelcast_namespace }}
          - --ignore-not-found=true
          - --wait=true
          - --timeout=300s
      loop: "{{ postgres_resource_names }}"
      loop_control:
        label: "{{ item.resource }}/{{ item.name }}"
      register: postgres_delete
      changed_when: "'deleted' in (postgres_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - postgres
        - k8s

    - name: Delete remaining Hazelcast workloads and services
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - "{{ item.resource }}"
          - "{{ item.name }}"
          - --namespace={{ hazelcast_namespace }}
          - --ignore-not-found=true
          - --wait=true
          - --timeout=300s
      loop:
        - { resource: "statefulset", name: "hz-primary" }
        - { resource: "statefulset", name: "hz-primary-lite" }
        - { resource: "statefulset", name: "hazelcast-mc" }
        - { resource: "service", name: "hz-primary" }
        - { resource: "service", name: "hazelcast-mc" }
      loop_control:
        label: "{{ item.resource }}/{{ item.name }}"
      register: hazelcast_workload_delete
      changed_when: "'deleted' in (hazelcast_workload_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - mc
        - k8s

    - name: Delete Hazelcast secrets
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - secret
          - "{{ item }}"
          - --namespace={{ hazelcast_namespace }}
          - --ignore-not-found=true
      loop: "{{ hazelcast_secret_names }}"
      loop_control:
        label: "{{ item }}"
      register: hazelcast_secret_delete
      changed_when: "'deleted' in (hazelcast_secret_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - secrets
        - k8s

    - name: Delete Hazelcast configmaps
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - configmap
          - "{{ item }}"
          - --namespace={{ hazelcast_namespace }}
          - --ignore-not-found=true
      loop: "{{ hazelcast_configmap_names }}"
      loop_control:
        label: "{{ item }}"
      register: hazelcast_configmap_delete
      changed_when: "'deleted' in (hazelcast_configmap_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - k8s

    - name: Gather PVCs in default namespace
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - persistentvolumeclaim
          - --namespace={{ hazelcast_namespace }}
          - --output=name
      register: default_pvc_info
      changed_when: false
      when: gke_cluster_exists
      tags:
        - undeploy
        - pvc
        - k8s

    - name: Delete PVCs created by this deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - "{{ item }}"
          - --namespace={{ hazelcast_namespace }}
          - --ignore-not-found=true
          - --wait=true
          - --timeout=300s
      loop: "{{ default_pvc_info.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: pvc_delete
      changed_when: "'deleted' in (pvc_delete.stdout | default(''))"
      when:
        - gke_cluster_exists
        - item is search(default_pvc_pattern)
      tags:
        - undeploy
        - pvc
        - k8s

    - name: Uninstall Hazelcast operator
      ansible.builtin.shell: |
        set -o pipefail
        helm uninstall hzoperator -n {{ hazelcast_namespace }} --wait
      args:
        executable: /bin/bash
      register: uninstall_hzoperator
      changed_when: uninstall_hzoperator.rc == 0
      failed_when: >
        (uninstall_hzoperator.rc not in [0, 1]) or
        (uninstall_hzoperator.rc == 1 and
         ('not found' not in (((uninstall_hzoperator.stderr | default('')) + (uninstall_hzoperator.stdout | default(''))) | lower)))
      when: gke_cluster_exists
      tags:
        - undeploy
        - hz
        - operator
        - k8s

    - name: Uninstall Chaos Mesh
      ansible.builtin.shell: |
        set -o pipefail
        helm uninstall chaos-mesh -n {{ chaos_namespace }} --wait
      args:
        executable: /bin/bash
      register: uninstall_chaos
      changed_when: uninstall_chaos.rc == 0
      failed_when: >
        (uninstall_chaos.rc not in [0, 1]) or
        (uninstall_chaos.rc == 1 and
         ('not found' not in (((uninstall_chaos.stderr | default('')) + (uninstall_chaos.stdout | default(''))) | lower)))
      when: gke_cluster_exists
      tags:
        - undeploy
        - chaos
        - k8s

    - name: Delete Chaos Mesh RBAC
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - "{{ item.resource }}"
          - "{{ item.name }}"
          - --ignore-not-found=true
      loop:
        - { resource: "clusterrolebinding", name: "chaos-experimenter-binding" }
        - { resource: "clusterrole", name: "chaos-experimenter" }
      loop_control:
        label: "{{ item.resource }}/{{ item.name }}"
      register: chaos_rbac_delete
      changed_when: "'deleted' in (chaos_rbac_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - chaos
        - k8s

    - name: Delete Chaos Mesh namespace
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - namespace
          - "{{ chaos_namespace }}"
          - --ignore-not-found=true
          - --wait=true
          - --timeout=300s
      register: chaos_namespace_delete
      changed_when: "'deleted' in (chaos_namespace_delete.stdout | default(''))"
      when: gke_cluster_exists
      tags:
        - undeploy
        - chaos
        - k8s

    - name: Delete VMs in the VPC network
      ansible.builtin.shell: |
        set -o pipefail
        gcloud compute instances delete {{ client_machine_name }}-{{ item }} \
          --project {{ project_id }} \
          --zone {{ zone }} \
          --quiet
      args:
        executable: /bin/bash
      loop: "{{ range(1, client_machine_count + 1) | list }}"
      register: delete_client_vm
      changed_when: delete_client_vm.rc == 0
      failed_when: >
        (delete_client_vm.rc not in [0, 1]) or
        (delete_client_vm.rc == 1 and
         ('was not found' not in (((delete_client_vm.stderr | default('')) + (delete_client_vm.stdout | default(''))) | lower) and
          'not found' not in (((delete_client_vm.stderr | default('')) + (delete_client_vm.stdout | default(''))) | lower)))
      tags:
        - undeploy
        - gke
        - client

    - name: Delete GKE cluster
      ansible.builtin.shell: |
        set -o pipefail
        gcloud container clusters delete {{ cluster_name }} \
          --zone {{ zone }} \
          --project {{ project_id }} \
          --quiet
      args:
        executable: /bin/bash
      register: delete_cluster
      changed_when: delete_cluster.rc == 0
      failed_when: >
        (delete_cluster.rc not in [0, 1]) or
        (delete_cluster.rc == 1 and
         ('was not found' not in (((delete_cluster.stderr | default('')) + (delete_cluster.stdout | default(''))) | lower) and
          'not found' not in (((delete_cluster.stderr | default('')) + (delete_cluster.stdout | default(''))) | lower)))
      tags:
        - undeploy
        - gke
        - cluster

    - name: Delete GKE firewall rule
      ansible.builtin.shell: |
        set -o pipefail
        gcloud compute firewall-rules delete {{ cluster_name }}-simulator \
          --project {{ project_id }} \
          --quiet
      args:
        executable: /bin/bash
      register: delete_firewall
      changed_when: delete_firewall.rc == 0
      failed_when: >
        (delete_firewall.rc not in [0, 1]) or
        (delete_firewall.rc == 1 and
         ('was not found' not in (((delete_firewall.stderr | default('')) + (delete_firewall.stdout | default(''))) | lower) and
          'not found' not in (((delete_firewall.stderr | default('')) + (delete_firewall.stdout | default(''))) | lower)))
      tags:
        - undeploy
        - gke
        - network

    - name: Find remaining firewall rules attached to the VPC
      ansible.builtin.command:
        argv:
          - gcloud
          - compute
          - firewall-rules
          - list
          - --project={{ project_id }}
          - --filter=network:{{ cluster_name }}-network
          - --format=value(name)
      register: remaining_firewall_rules
      changed_when: false
      tags:
        - undeploy
        - gke
        - network

    - name: Delete remaining firewall rules attached to the VPC
      ansible.builtin.command:
        argv:
          - gcloud
          - compute
          - firewall-rules
          - delete
          - "{{ item }}"
          - --project={{ project_id }}
          - --quiet
      loop: "{{ remaining_firewall_rules.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: delete_remaining_firewall_rule
      changed_when: delete_remaining_firewall_rule.rc == 0
      tags:
        - undeploy
        - gke
        - network

    - name: Delete GKE subnet
      ansible.builtin.shell: |
        set -o pipefail
        gcloud compute networks subnets delete {{ cluster_name }}-network \
          --region {{ region }} \
          --project {{ project_id }} \
          --quiet
      args:
        executable: /bin/bash
      register: delete_subnet
      changed_when: delete_subnet.rc == 0
      failed_when: >
        (delete_subnet.rc not in [0, 1]) or
        (delete_subnet.rc == 1 and
         ('was not found' not in (((delete_subnet.stderr | default('')) + (delete_subnet.stdout | default(''))) | lower) and
          'not found' not in (((delete_subnet.stderr | default('')) + (delete_subnet.stdout | default(''))) | lower)))
      tags:
        - undeploy
        - gke
        - network

    - name: Delete GKE network
      ansible.builtin.shell: |
        set -o pipefail
        gcloud compute networks delete {{ cluster_name }}-network \
          --project {{ project_id }} \
          --quiet
      args:
        executable: /bin/bash
      register: delete_network
      changed_when: delete_network.rc == 0
      failed_when: >
        (delete_network.rc not in [0, 1]) or
        (delete_network.rc == 1 and
         ('was not found' not in (((delete_network.stderr | default('')) + (delete_network.stdout | default(''))) | lower) and
          'not found' not in (((delete_network.stderr | default('')) + (delete_network.stdout | default(''))) | lower)))
      tags:
        - undeploy
        - gke
        - network
