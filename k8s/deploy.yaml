- name: Deploy Hazelcast cluster and application
  hosts: localhost
  vars_files:
    - vars/main.yml
  pre_tasks:
    - name: Validate dedup test mode
      ansible.builtin.assert:
        that:
          - dedup_test_mode in ['ap', 'cp', 'jet', 'merchant_profile']
        fail_msg: "dedup_test_mode must be ap, cp, jet, or merchant_profile."
      tags:
        - always
  roles:
    - gke
    - postgres
    - hz
    - chaos
