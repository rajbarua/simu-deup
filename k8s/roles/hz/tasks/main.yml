---
- name: Add helm repo of Hazelcast
  kubernetes.core.helm_repository:
    name: hazelcast
    repo_url: "https://hazelcast-charts.s3.amazonaws.com/"
    force_update: true
  tags:
    - hz
    - operator
    - hz-init
# tasks file for k8s/roles/hz
- name: Install Hazelcast Operator
  kubernetes.core.helm:
    name: hzoperator
    chart_ref: hazelcast/hazelcast-platform-operator
    chart_version: "{{ hazelcast_operator_chart_version }}"
    release_namespace: default
    values:
      installCRDs: true
      nodeSelector:
        component: "{{ mc_cluster_node_pool }}"
    wait: true
    wait_timeout: 5m
  tags:
    - hz
    - operator
    - hz-init 
- name: Wait for operator to be ready
  shell: "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=hazelcast-platform-operator --timeout=300s -n default"
  tags:
    - hz
    - operator
    - hz-init
######################
## License
######################
- name: Check configured Hazelcast license file
  ansible.builtin.stat:
    path: "{{ hazelcast_license_file | expanduser }}"
  register: hazelcast_license_file_stat
  tags:
    - hz
    - hz-init
    - mc

- name: Validate Hazelcast license source
  ansible.builtin.fail:
    msg: >-
      Set HAZELCAST_LICENSE_KEY or create {{ hazelcast_license_file }} before
      deploying Hazelcast with the Platform Operator.
  when:
    - lookup('env', 'HAZELCAST_LICENSE_KEY') | trim | length == 0
    - not hazelcast_license_file_stat.stat.exists
  tags:
    - hz
    - hz-init
    - mc

- name: Load Hazelcast license key
  ansible.builtin.set_fact:
    hazelcast_license_key: >-
      {{
        (lookup('env', 'HAZELCAST_LICENSE_KEY') | trim)
        if (lookup('env', 'HAZELCAST_LICENSE_KEY') | trim | length > 0)
        else (lookup('file', hazelcast_license_file) | trim)
      }}
  no_log: true
  tags:
    - hz
    - hz-init
    - mc

- name: Create Hazelcast license secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ hazelcast_license_secret_name }}"
        namespace: default
      type: Opaque
      stringData:
        license-key: "{{ hazelcast_license_key }}"
  no_log: true
  tags:
    - hz
    - hz-init
    - mc
######################
## User code
######################
- name: Check Simulator dedup user-code jar
  ansible.builtin.stat:
    path: "{{ simu_dedup_user_code_jar }}"
    checksum_algorithm: sha256
  register: simu_dedup_user_code_jar_stat
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps
    - jet

- name: Validate Simulator dedup user-code jar
  ansible.builtin.fail:
    msg: "Build {{ simu_dedup_user_code_jar }} with `mvn -DskipTests package` before deploying Hazelcast."
  when: not simu_dedup_user_code_jar_stat.stat.exists
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps

- name: Read Simulator dedup user-code jar
  ansible.builtin.slurp:
    src: "{{ simu_dedup_user_code_jar }}"
  register: simu_dedup_user_code
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps

- name: Create ConfigMap for Simulator dedup user-code jar
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ simu_dedup_user_code_config_map }}"
        namespace: default
      binaryData: "{{ {simu_dedup_user_code_jar_name: simu_dedup_user_code.content} }}"
  register: simu_dedup_user_code_config_map_result
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps
######################
## SSL
## https://docs.ansible.com/ansible/latest/collections/community/crypto/docsite/guide_selfsigned.html
## https://docs.hazelcast.com/operator/latest/tls
######################
- name: Create private key
  community.crypto.openssl_privatekey:
    path: "{{ self_signed_cert_key_file }}"
    size: 2048
    format: pkcs8
  tags:
    - ssl
- name: Create certificate signing request (CSR) for self-signed certificate
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ self_signed_cert_key_file }}"
    common_name: hazelcast.com
    organization_name: Hazelcast
    subject_alt_name:
      - DNS:hazelcast.com
      - DNS:hazelcast
      - DNS:hazelcast.default.svc.cluster.local
      - DNS:hz-primary
      - DNS:hz-primary.default.svc.cluster.local
      - DNS:hz-secondary
      - DNS:hz-secondary.default.svc.cluster.local
  register: csr
  tags:
    - ssl
- name: Create simple self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ self_signed_cert_cert_file }}"
    privatekey_path: "{{ self_signed_cert_key_file }}"
    csr_content: "{{ csr.csr }}"
    provider: selfsigned
  tags:
    - ssl
- name: Kubernetes tls secret from the certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hazelcast-ssl
        namespace: default
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ lookup('file', self_signed_cert_cert_file) | b64encode }}"
        tls.key: "{{ lookup('file', self_signed_cert_key_file) | b64encode }}"
  tags:
      - ssl
- name: Using java_keystore module create a keystore
  community.general.java_keystore:
    name: hazelcast-ssl
    certificate: "{{ lookup('file', self_signed_cert_cert_file) }}"
    private_key: "{{ lookup('file', self_signed_cert_key_file) }}"
    password: hazelcast
    dest: "{{ self_signed_cert_keystore_file }}"
  tags:
    - ssl
- name: Read generated keystore
  ansible.builtin.slurp:
    src: "{{ self_signed_cert_keystore_file | expanduser }}"
  register: hazelcast_keystore
  tags:
    - ssl
- name: Create a ConfigMap from the keystore file
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: hazelcast-keystore
        namespace: default
      binaryData:
        hazelcast.jks: "{{ hazelcast_keystore.content }}"
  tags:
      - ssl
######################
## Clusters
######################
- name: Custom configuration for primary Hazelcast. Used for data-connection
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', './templates/primary-custom-config-cm.j2') }}"
  no_log: true
  tags:
    - hz-init
    - hz-primary
    - hz
    - hz-platform
- name: Install Hazelcast primary cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: hazelcast.com/v1alpha1
      kind: Hazelcast
      metadata:
        namespace: default
        name: hz-primary
      spec:
        scheduling:
          nodeSelector:
            component: "{{ hz_cluster_node_pool }}"     
        customConfigSecretName: "{{ hazelcast_custom_config_secret_name }}"
        clusterSize: "{{ primary_cluster_size }}"
        repository: 'docker.io/hazelcast/hazelcast-enterprise'
        version: "{{ hazelcast_version }}"
        licenseKeySecretName: "{{ hazelcast_license_secret_name }}"
        clusterName: hz-primary
        cpSubsystem:
          dataLoadTimeoutSeconds: "{{ cp_data_load_timeout_seconds | int }}"
          pvc:
            accessModes: ["ReadWriteOnce"]
            requestStorage: "{{ cp_persistence_storage_size }}"
            storageClassName: "{{ cp_persistence_storage_class }}"
        jet:
          resourceUploadEnabled: true
          configMaps:
            - "{{ simu_dedup_user_code_config_map }}"
        userCodeDeployment:
          clientEnabled: true
          configMaps:
            - "{{ simu_dedup_user_code_config_map }}"
        resources:
          requests:
            cpu: "{{ hazelcast_cpu_request }}"
            memory: "{{ hazelcast_memory_request }}"
          limits:
            memory: "{{ hazelcast_memory_limit }}"
        nativeMemory:
          allocatorType: POOLED
          size: "{{ hazelcast_native_memory_size }}"
        jvm:
          gc:
            logging: true
          args:
            - "-Xms{{ hazelcast_jvm_heap }} -Xmx{{ hazelcast_jvm_heap }}"
        properties:
          "hazelcast.slow.operation.detector.enabled": "true"        
          "hazelcast.shutdownhook.policy": "GRACEFUL"
          #"hazelcast.heartbeat.interval.seconds": "1"
          #"hazelcast.max.no.heartbeat.seconds": "3"
          #"hazelcast.operation.call.timeout.millis": "3000"
          #"hazelcast.partition.count": "647"
  register: hazelcast_primary_result
  tags:
    - hz-primary
    - hz
    - hz-platform
- name: Wait for Hazelcast primary cluster to be ready
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl wait \
      --for=jsonpath='{.status.phase}'=Running \
      hazelcast/hz-primary \
      -n default \
      --timeout=600s
    kubectl wait \
      --for=condition=ready \
      pod \
      -l app.kubernetes.io/instance=hz-primary,app.kubernetes.io/name=hazelcast \
      -n default \
      --timeout=600s
  args:
    executable: /bin/bash
  tags:
    - hz-primary
    - hz
    - hz-platform

- name: Restart existing Hazelcast members after user-code changes
  ansible.builtin.command: kubectl rollout restart statefulset/hz-primary -n default
  when:
    - simu_dedup_user_code_config_map_result is defined
    - simu_dedup_user_code_config_map_result.changed
    - hazelcast_primary_result is defined
    - not hazelcast_primary_result.changed
  tags:
    - hz-primary
    - hz
    - hz-platform

- name: Wait for restarted Hazelcast members
  ansible.builtin.command: kubectl rollout status statefulset/hz-primary -n default --timeout=600s
  when:
    - simu_dedup_user_code_config_map_result is defined
    - simu_dedup_user_code_config_map_result.changed
    - hazelcast_primary_result is defined
    - not hazelcast_primary_result.changed
  tags:
    - hz-primary
    - hz
    - hz-platform

- name: Enable Smart external access after Hazelcast bootstrap
  kubernetes.core.k8s_json_patch:
    api_version: hazelcast.com/v1alpha1
    kind: Hazelcast
    namespace: default
    name: hz-primary
    patch:
      - op: add
        path: /spec/exposeExternally
        value:
          type: Smart
          discoveryServiceType: LoadBalancer
          memberAccess: LoadBalancer
  tags:
    - hz-primary
    - hz
    - hz-platform

- name: Wait for Hazelcast Smart client services and members
  ansible.builtin.shell: |
    set -euo pipefail
    for service_name in hz-primary hz-primary-0 hz-primary-1 hz-primary-2; do
      kubectl wait \
        --for=create \
        "service/${service_name}" \
        -n default \
        --timeout=600s
      kubectl wait \
        --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' \
        "service/${service_name}" \
        -n default \
        --timeout=600s
    done
    kubectl wait \
      --for=condition=ready \
      pod \
      -l app.kubernetes.io/instance=hz-primary,app.kubernetes.io/name=hazelcast \
      -n default \
      --timeout=600s
    kubectl wait \
      --for=jsonpath='{.status.phase}'=Running \
      hazelcast/hz-primary \
      -n default \
      --timeout=600s
  args:
    executable: /bin/bash
  tags:
    - hz-primary
    - hz
    - hz-platform

- name: Remove previous Jet deduplication job before code redeployment
  kubernetes.core.k8s:
    state: absent
    api_version: hazelcast.com/v1alpha1
    kind: JetJob
    namespace: default
    name: "{{ jet_job_resource_name }}"
    wait: true
    wait_timeout: 600
  when:
    - dedup_test_mode == 'jet'
    - >-
      jet_job_redeploy | bool or
      (simu_dedup_user_code_config_map_result is defined and
      simu_dedup_user_code_config_map_result.changed)
  tags:
    - hz
    - jet
######################
## Maps
######################
- name: Validate deduplicate MapStore password source
  ansible.builtin.fail:
    msg: "Set SIMU_DEDUP_POSTGRES_PASSWORD before creating the deduplicate MapStore secret."
  when:
    - dedup_test_mode != 'cp'
    - dedup_postgres_password | trim | length == 0
  tags:
    - hz
    - maps

- name: Create MapStore properties secret for deduplicate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ dedup_mapstore_secret_name }}"
        namespace: default
      type: Opaque
      stringData:
        tableName: "{{ dedup_table_name }}"
        connectionName: "{{ dedup_postgres_data_connection }}"
        batchSize: "{{ dedup_mapstore_batch_size }}"
        ttlSeconds: "{{ dedup_map_ttl_seconds }}"
  no_log: true
  when: dedup_test_mode != 'cp'
  tags:
    - hz
    - maps

- name: Create deduplicate map with Postgres MapStore
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: hazelcast.com/v1alpha1
      kind: Map
      metadata:
        name: "{{ dedup_map_name }}"
        namespace: default
      spec:
        hazelcastResourceName: hz-primary
        backupCount: 1
        inMemoryFormat: NATIVE
        timeToLiveSeconds: "{{ dedup_map_ttl_seconds | int }}"
        mapStore:
          className: com.hazelcast.simudedupe.store.TransactionDeduplicationMapStore
          initialMode: EAGER
          writeDelaySeconds: 1
          writeBatchSize: "{{ dedup_mapstore_batch_size | int }}"
          writeCoalescing: true
          propertiesSecretName: "{{ dedup_mapstore_secret_name }}"
  tags:
    - hz
    - maps
  when: dedup_test_mode != 'cp'

- name: Create Jet input map with event journal
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: hazelcast.com/v1alpha1
      kind: Map
      metadata:
        name: "{{ jet_input_map_name }}"
        namespace: default
      spec:
        hazelcastResourceName: hz-primary
        backupCount: 1
        inMemoryFormat: NATIVE
        timeToLiveSeconds: "{{ jet_transient_map_ttl_seconds | int }}"
        eventJournal:
          capacity: "{{ jet_event_journal_capacity | int }}"
          timeToLiveSeconds: "{{ jet_event_journal_ttl_seconds | int }}"
  when: dedup_test_mode == 'jet'
  tags:
    - hz
    - maps
    - jet

- name: Create Jet result map
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: hazelcast.com/v1alpha1
      kind: Map
      metadata:
        name: "{{ jet_result_map_name }}"
        namespace: default
      spec:
        hazelcastResourceName: hz-primary
        backupCount: 1
        inMemoryFormat: NATIVE
        timeToLiveSeconds: "{{ jet_transient_map_ttl_seconds | int }}"
  when: dedup_test_mode == 'jet'
  tags:
    - hz
    - maps
    - jet

- name: Wait for Jet maps to be configured
  ansible.builtin.shell: |
    set -euo pipefail
    for map_name in {{ dedup_map_name }} {{ jet_input_map_name }} {{ jet_result_map_name }}; do
      kubectl wait \
        --for=jsonpath='{.status.state}'=Success \
        "map.hazelcast.com/${map_name}" \
        -n default \
        --timeout=600s
    done
  args:
    executable: /bin/bash
  when: dedup_test_mode == 'jet'
  tags:
    - hz
    - maps
    - jet

- name: Start Jet deduplication job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: hazelcast.com/v1alpha1
      kind: JetJob
      metadata:
        name: "{{ jet_job_resource_name }}"
        namespace: default
      spec:
        name: "{{ jet_job_name }}"
        hazelcastResourceName: hz-primary
        state: Running
        # Jet ConfigMap resources are mounted below a directory named after
        # their ConfigMap. The member-side submission API resolves this path
        # relative to /opt/hazelcast/jetJobJars.
        jarName: "{{ simu_dedup_jet_jar_name }}"
        mainClass: "{{ jet_job_main_class }}"
        parameters:
          - "{{ jet_input_map_name }}"
          - "{{ jet_result_map_name }}"
          - "{{ dedup_map_name }}"
          - "{{ jet_max_concurrent_ops }}"
          - "{{ jet_snapshot_interval_millis }}"
          - "{{ jet_job_name }}"
  when: dedup_test_mode == 'jet'
  tags:
    - hz
    - jet

- name: Wait for Jet deduplication job to be running
  ansible.builtin.shell: >-
    kubectl wait
    --for=jsonpath='{.status.phase}'=Running
    jetjob.hazelcast.com/{{ jet_job_resource_name }}
    -n default
    --timeout=900s
  when: dedup_test_mode == 'jet'
  tags:
    - hz
    - jet
######################
## MC
######################
- name: Start management center
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: hazelcast.com/v1alpha1
      kind: ManagementCenter
      metadata:
        namespace: default
        name: hazelcast-mc
      spec:
        scheduling:
          nodeSelector:
            component: "{{ mc_cluster_node_pool }}"              
        repository: 'docker.io/hazelcast/management-center'
        version: "{{ hazelcast_mc_version }}"
        licenseKeySecretName: "{{ hazelcast_license_secret_name }}"
        externalConnectivity:
          type: LoadBalancer
        hazelcastClusters:
          - address: hz-primary
            name: hz-primary
        persistence:
          enabled: true
          size: 1Gi
        jvm:
          args:
          - "-Dhazelcast.mc.port=8080"
          - "-Xms{{ management_center_jvm_heap }} -Xmx{{ management_center_jvm_heap }}"
        resources:
          requests:
            cpu: "{{ management_center_cpu_request }}"
            memory: "{{ management_center_memory_request }}"
  tags:
    - mc
    - hz
#- name: Pause for 30 secs to allow management center pod to be visible to K8S
#  ansible.builtin.pause:
#    seconds: 31
#    tags:
#      - mc
#      - hz
- name: Wait for management centre to be ready
  shell: "kubectl wait --for=condition=ready pod/hazelcast-mc-0 -n default --timeout=300s"
  tags:
    - mc
    - hz
