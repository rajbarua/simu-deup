---
- name: Add Hazelcast Helm repository
  kubernetes.core.helm_repository:
    name: hazelcast
    repo_url: https://hazelcast-charts.s3.amazonaws.com/
    force_update: true
  tags:
    - hz
    - hz-init

######################
## License
######################
- name: Check configured Hazelcast license file
  ansible.builtin.stat:
    path: "{{ hazelcast_license_file | expanduser }}"
  register: hazelcast_license_file_stat
  tags:
    - hz
    - hz-init
    - mc

- name: Validate Hazelcast license source
  ansible.builtin.fail:
    msg: "Set HAZELCAST_LICENSE_KEY or create {{ hazelcast_license_file }} before deploying Hazelcast Enterprise."
  when:
    - lookup('env', 'HAZELCAST_LICENSE_KEY') | trim | length == 0
    - not hazelcast_license_file_stat.stat.exists
  tags:
    - hz
    - hz-init
    - mc

- name: Load Hazelcast license key
  ansible.builtin.set_fact:
    hazelcast_license_key: >-
      {{
        (lookup('env', 'HAZELCAST_LICENSE_KEY') | trim)
        if (lookup('env', 'HAZELCAST_LICENSE_KEY') | trim | length > 0)
        else (lookup('file', hazelcast_license_file) | trim)
      }}
  no_log: true
  tags:
    - hz
    - hz-init
    - mc

- name: Create Hazelcast license secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ hazelcast_license_secret_name }}"
        namespace: default
      type: Opaque
      stringData:
        key: "{{ hazelcast_license_key }}"
  no_log: true
  tags:
    - hz
    - hz-init
    - mc

######################
## User code
######################
- name: Check Simulator dedup user-code jar
  ansible.builtin.stat:
    path: "{{ simu_dedup_user_code_jar }}"
    checksum_algorithm: sha256
  register: simu_dedup_user_code_jar_stat
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps
    - jet

- name: Validate Simulator dedup user-code jar
  ansible.builtin.fail:
    msg: "Build {{ simu_dedup_user_code_jar }} with `mvn -DskipTests package` before deploying Hazelcast."
  when: not simu_dedup_user_code_jar_stat.stat.exists
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps
    - jet

- name: Read Simulator dedup user-code jar
  ansible.builtin.slurp:
    src: "{{ simu_dedup_user_code_jar }}"
  register: simu_dedup_user_code
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps
    - jet

- name: Create ConfigMap for Simulator dedup user-code jar
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ simu_dedup_user_code_config_map }}"
        namespace: default
      binaryData: "{{ {simu_dedup_user_code_jar_name: simu_dedup_user_code.content} }}"
  register: simu_dedup_user_code_config_map_result
  tags:
    - hz
    - hz-init
    - hz-primary
    - maps
    - jet

- name: Validate PostgreSQL password
  ansible.builtin.fail:
    msg: Set SIMU_DEDUP_POSTGRES_PASSWORD to a non-empty, single-line value before deploying the MapStore-backed Hazelcast maps.
  when: >-
    dedup_postgres_password | trim | length == 0
    or '\n' in dedup_postgres_password
    or '\r' in dedup_postgres_password
  tags:
    - hz
    - maps

######################
## Hazelcast and Management Center
######################
- name: Install Hazelcast Enterprise and Management Center
  kubernetes.core.helm:
    name: "{{ hazelcast_helm_release_name }}"
    chart_ref: hazelcast/hazelcast-enterprise
    chart_version: "{{ hazelcast_helm_chart_version }}"
    release_namespace: default
    create_namespace: false
    values: "{{ lookup('template', 'hazelcast-values.yml.j2') | from_yaml }}"
    wait: true
    wait_timeout: 15m
  register: hazelcast_helm_result
  tags:
    - hz
    - hz-init
    - hz-primary
    - hz-platform
    - maps
    - mc
    - jet

- name: Restart existing Hazelcast members after user-code changes
  ansible.builtin.command: kubectl rollout restart statefulset/{{ hazelcast_helm_release_name }} -n default
  when:
    - simu_dedup_user_code_config_map_result.changed
    - not hazelcast_helm_result.changed
  tags:
    - hz
    - hz-primary
    - hz-platform
    - maps
    - jet

- name: Wait for Hazelcast members and Management Center
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl rollout status statefulset/{{ hazelcast_helm_release_name }} -n default --timeout=900s
    kubectl wait \
      --for=condition=ready \
      pod \
      -l app.kubernetes.io/instance={{ hazelcast_helm_release_name }},role=hazelcast \
      -n default \
      --timeout=900s
    kubectl wait \
      --for=condition=ready \
      pod/{{ hazelcast_helm_release_name }}-mancenter-0 \
      -n default \
      --timeout=600s
  args:
    executable: /bin/bash
  changed_when: false
  tags:
    - hz
    - hz-primary
    - hz-platform
    - maps
    - mc
    - jet

- name: Wait for Hazelcast member load balancers
  ansible.builtin.shell: |
    set -euo pipefail
    for ordinal in $(seq 0 $(({{ primary_cluster_size | int }} - 1))); do
      service_name={{ hazelcast_helm_release_name }}-${ordinal}
      kubectl wait --for=create service/${service_name} -n default --timeout=600s
      kubectl wait \
        --for=jsonpath='{.status.loadBalancer.ingress[0]}' \
        service/${service_name} \
        -n default \
        --timeout=600s
    done
  args:
    executable: /bin/bash
  changed_when: false
  tags:
    - hz
    - hz-primary
    - hz-platform

######################
## Jet
######################
- name: Inspect existing Jet deduplication jobs
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - "{{ hazelcast_helm_release_name }}-0"
      - --namespace=default
      - --
      - /opt/hazelcast/bin/hz-cli
      - list-jobs
      - "-t={{ hazelcast_helm_release_name }}@127.0.0.1:5701"
  register: jet_job_list
  changed_when: false
  when: dedup_test_mode == 'jet'
  tags:
    - hz
    - jet

- name: Cancel existing Jet deduplication job when redeployment is requested
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - "{{ hazelcast_helm_release_name }}-0"
      - --namespace=default
      - --
      - /opt/hazelcast/bin/hz-cli
      - cancel
      - "-t={{ hazelcast_helm_release_name }}@127.0.0.1:5701"
      - "{{ jet_job_name }}"
  when:
    - dedup_test_mode == 'jet'
    - jet_job_redeploy | bool
    - jet_running_rows | length > 0
  vars:
    jet_running_rows: >-
      {{ jet_job_list.stdout_lines
         | select('search', 'RUNNING')
         | select('search', jet_job_name | regex_escape)
         | list }}
  tags:
    - hz
    - jet

- name: Submit Jet deduplication job from a Hazelcast member
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - "{{ hazelcast_helm_release_name }}-0"
      - --namespace=default
      - --
      - /opt/hazelcast/bin/hz-cli
      - submit
      - "-t={{ hazelcast_helm_release_name }}@127.0.0.1:5701"
      - -c
      - "{{ jet_job_main_class }}"
      - "{{ simu_dedup_member_jar_path }}"
      - "{{ jet_input_map_name }}"
      - "{{ jet_result_map_name }}"
      - "{{ dedup_map_name }}"
      - "{{ jet_max_concurrent_ops }}"
      - "{{ jet_snapshot_interval_millis }}"
      - "{{ jet_job_name }}"
  when:
    - dedup_test_mode == 'jet'
    - jet_job_redeploy | bool or jet_running_rows | length == 0
  vars:
    jet_running_rows: >-
      {{ jet_job_list.stdout_lines
         | select('search', 'RUNNING')
         | select('search', jet_job_name | regex_escape)
         | list }}
  tags:
    - hz
    - jet

- name: Wait for Jet deduplication job to be running
  ansible.builtin.shell: |
    set -euo pipefail
    deadline=$((SECONDS + 900))
    while (( SECONDS < deadline )); do
      if kubectl exec {{ hazelcast_helm_release_name }}-0 -n default -- \
          /opt/hazelcast/bin/hz-cli list-jobs \
          -t={{ hazelcast_helm_release_name }}@127.0.0.1:5701 2>/dev/null | \
          grep -F "{{ jet_job_name }}" | grep -q RUNNING; then
        exit 0
      fi
      sleep 10
    done
    echo "Jet job {{ jet_job_name }} did not reach RUNNING within 900 seconds" >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
  when: dedup_test_mode == 'jet'
  tags:
    - hz
    - jet
