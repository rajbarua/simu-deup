---
postgres_image: "docker.io/library/postgres:18.4"
postgres_user: "dedup"
postgres_password: "{{ lookup('env', 'SIMU_DEDUP_POSTGRES_PASSWORD') }}"
postgres_database: "dedup"
postgres_node_pool: "hazelcast-cluster"
dedup_table_name: "deduplicate"
dedup_map_ttl_seconds: "31622400"

postgres_cpu_request: "6"
postgres_memory_request: "24Gi"
postgres_cpu_limit: "8"
postgres_memory_limit: "24Gi"
postgres_storage_class: "standard-rwo"
postgres_storage_size: "100Gi"
postgres_shm_size: "4Gi"

postgres_synchronous_commit: "off"
postgres_wal_compression: "on"
postgres_min_wal_size: "4GB"
postgres_max_wal_size: "16GB"
postgres_checkpoint_timeout: "15min"
postgres_checkpoint_completion_target: "0.9"
postgres_shared_buffers: "6GB"
postgres_maintenance_work_mem: "512MB"
postgres_max_connections: "320"
