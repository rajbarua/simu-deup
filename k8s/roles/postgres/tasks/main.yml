---
- name: Validate Postgres password source
  ansible.builtin.fail:
    msg: "Set SIMU_DEDUP_POSTGRES_PASSWORD before deploying Postgres."
  when: postgres_password | trim | length == 0
  tags:
    - postgres

- name: Deploy Postgres for dedup persistence
  kubernetes.core.k8s:
    state: present
    namespace: default
    definition: |
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-auth
      type: Opaque
      stringData:
        POSTGRES_USER: "{{ postgres_user }}"
        POSTGRES_PASSWORD: "{{ postgres_password }}"
        POSTGRES_DB: "{{ postgres_database }}"
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgres-init-scripts
      data:
        001_schema.sql: |
          DROP TABLE IF EXISTS deduplicate_kv;
          DROP TABLE IF EXISTS payment_dedup;
          DROP TABLE IF EXISTS dedup_attempts;

          CREATE TABLE IF NOT EXISTS {{ dedup_table_name }} (
            id VARCHAR(200) PRIMARY KEY,
            payload JSONB NOT NULL,
            expirationTime BIGINT NOT NULL
          );

          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_{{ dedup_table_name }}_expirationTime
            ON {{ dedup_table_name }}(expirationTime);
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
        labels:
          app.kubernetes.io/name: postgres
      spec:
        type: ClusterIP
        ports:
          - name: postgres
            port: 5432
            targetPort: 5432
        selector:
          app.kubernetes.io/name: postgres
      ---
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        labels:
          app.kubernetes.io/name: postgres
      spec:
        serviceName: postgres
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: postgres
        template:
          metadata:
            labels:
              app.kubernetes.io/name: postgres
          spec:
            nodeSelector:
              component: "{{ postgres_node_pool }}"
            securityContext:
              fsGroup: 999
              fsGroupChangePolicy: OnRootMismatch
            containers:
              - name: postgres
                image: "{{ postgres_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 5432
                    name: postgres
                envFrom:
                  - secretRef:
                      name: postgres-auth
                env:
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                args:
                  - "-c"
                  - "synchronous_commit={{ postgres_synchronous_commit }}"
                  - "-c"
                  - "wal_compression={{ postgres_wal_compression }}"
                  - "-c"
                  - "min_wal_size={{ postgres_min_wal_size }}"
                  - "-c"
                  - "max_wal_size={{ postgres_max_wal_size }}"
                  - "-c"
                  - "checkpoint_timeout={{ postgres_checkpoint_timeout }}"
                  - "-c"
                  - "checkpoint_completion_target={{ postgres_checkpoint_completion_target }}"
                  - "-c"
                  - "shared_buffers={{ postgres_shared_buffers }}"
                  - "-c"
                  - "maintenance_work_mem={{ postgres_maintenance_work_mem }}"
                  - "-c"
                  - "max_connections={{ postgres_max_connections }}"
                readinessProbe:
                  exec:
                    command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"dbname=$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
                livenessProbe:
                  exec:
                    command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"dbname=$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
                resources:
                  requests:
                    cpu: "{{ postgres_cpu_request }}"
                    memory: "{{ postgres_memory_request }}"
                  limits:
                    cpu: "{{ postgres_cpu_limit }}"
                    memory: "{{ postgres_memory_limit }}"
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/postgresql/data
                  - name: init-scripts
                    mountPath: /docker-entrypoint-initdb.d
                  - name: dshm
                    mountPath: /dev/shm
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: "{{ postgres_shm_size }}"
              - name: init-scripts
                configMap:
                  name: postgres-init-scripts
                  defaultMode: 0755
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: "{{ postgres_storage_class }}"
              resources:
                requests:
                  storage: "{{ postgres_storage_size }}"
  tags:
    - postgres

- name: Wait for Postgres to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    wait: yes
    namespace: default
    name: postgres-0
    wait_sleep: 10
    wait_timeout: 360
  tags:
    - postgres

- name: Remove previous dedup schema job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: postgres-dedup-schema
    namespace: default
  tags:
    - postgres
    - postgres-schema

- name: Apply dedup schema to existing Postgres
  kubernetes.core.k8s:
    state: present
    namespace: default
    definition: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: postgres-dedup-schema
        namespace: default
      spec:
        ttlSecondsAfterFinished: 300
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: psql
                image: "{{ postgres_image }}"
                imagePullPolicy: IfNotPresent
                envFrom:
                  - secretRef:
                      name: postgres-auth
                command:
                  - /bin/sh
                  - -lc
                args:
                  - |
                    set -eu
                    export PGPASSWORD="$POSTGRES_PASSWORD"
                    psql -h postgres.default.svc.cluster.local -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
                    DROP TABLE IF EXISTS deduplicate_kv;
                    DROP TABLE IF EXISTS payment_dedup;
                    DROP TABLE IF EXISTS dedup_attempts;

                    CREATE TABLE IF NOT EXISTS {{ dedup_table_name }} (
                      id VARCHAR(200) PRIMARY KEY
                    );
                    ALTER TABLE {{ dedup_table_name }}
                      ADD COLUMN IF NOT EXISTS payload JSONB,
                      ADD COLUMN IF NOT EXISTS expirationTime BIGINT;
                    UPDATE {{ dedup_table_name }}
                      SET payload = to_jsonb(id)
                      WHERE payload IS NULL;
                    UPDATE {{ dedup_table_name }}
                      SET expirationTime = ((EXTRACT(epoch FROM current_timestamp) * 1000)::bigint + ({{ dedup_map_ttl_seconds | int }} * 1000))
                      WHERE expirationTime IS NULL;
                    ALTER TABLE {{ dedup_table_name }}
                      ALTER COLUMN id TYPE VARCHAR(200),
                      ALTER COLUMN payload SET NOT NULL,
                      ALTER COLUMN expirationTime SET NOT NULL,
                      DROP COLUMN IF EXISTS service_name,
                      DROP COLUMN IF EXISTS payment_id,
                      DROP COLUMN IF EXISTS first_seen_at,
                      DROP COLUMN IF EXISTS last_seen_at,
                      DROP COLUMN IF EXISTS seen_count,
                      DROP COLUMN IF EXISTS expires_at;
                    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_{{ dedup_table_name }}_expirationTime
                      ON {{ dedup_table_name }}(expirationTime);
                    SQL
  tags:
    - postgres
    - postgres-schema

- name: Wait for dedup schema job to complete
  ansible.builtin.shell: "kubectl wait --for=condition=complete job/postgres-dedup-schema -n default --timeout=300s"
  tags:
    - postgres
    - postgres-schema
