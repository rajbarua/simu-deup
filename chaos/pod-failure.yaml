apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: fail-pod
  namespace: chaos-mesh
spec:
  action: pod-failure
  mode: one #pick one Hazelcast pod to fail
  selector:
    namespaces:
      - default
    labelSelectors:
      'app.kubernetes.io/instance': 'hz-primary' 
  duration: '10s'
