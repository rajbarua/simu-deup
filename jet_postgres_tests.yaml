- name: jet-postgres-dedup-10k-no-chaos
  repetitions: 1
  duration: 300s
  driver: hazelcast-enterprise5
  version: maven=5.7.0
  clients: 2
  members: 0
  loadgenerator_hosts: loadgenerators
  node_hosts: nodes
  client_args: >
    -Xms6g
    -Xmx6g
    --add-modules java.se
    --add-exports java.base/jdk.internal.ref=ALL-UNNAMED
    --add-opens java.base/java.lang=ALL-UNNAMED
    --add-opens java.base/sun.nio.ch=ALL-UNNAMED
    --add-opens java.management/sun.management=ALL-UNNAMED
    --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED
  performance_monitor_interval_seconds: 1
  verify_enabled: true
  warmup_seconds: 10
  cooldown_seconds: 10
  test:
    - class: com.hazelcast.simudedupe.tests.JetDeduplicationTest
      name: jet-deduplicate
      threadCount: 40
      inputMapName: deduplicate-jet-input
      resultMapName: deduplicate-jet-results
      jetJobName: simu-dedup-jet
      existingKeyDomain: 1_000_000
      existingKeySampleSize: 10_000
      existingKeyPercentage: 50
      existingIdPrefix: "100000000000000000"
      newIdPrefix: "2"
      operationIdPrefix: "9"
      newKeyRunId: 1
      jobStartTimeoutSeconds: 600
      resultDrainTimeoutSeconds: 120
      resultRecoveryBatchSize: 1_000
      resetTransientMaps: true
      # Simulator applies the rate per client: 2 x 5K = 10K aggregate TPS.
      ratePerSecond: 5_000
